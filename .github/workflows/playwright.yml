name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22 

      - name: Create .env
        working-directory: UITesting
        run: 
          echo "BASEURL=${{ vars.BASEURL }}" > .env

      - name: Create secrets.local.env
        working-directory: UITesting
        run: |
          echo "CARD_NUMBER=${{ secrets.CARD_NUMBER }}" > secrets.local.env
          echo "EXPIRY=${{ secrets.EXPIRY }}" >> secrets.local.env
          echo "CVV=${{ secrets.CVV }}" >> secrets.local.env
      - name: Install Dependencies
        working-directory: UITesting
        run: npm ci
        
      - name: Install Browsers
        working-directory: UITesting
        run: npx playwright install --with-deps

      - name: Run playwright Test 
        working-directory: UITesting
        run: npx playwright test
        
      - name: Upload Reports
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: UITesting/playwright-report
          
      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: UITesting/test-results
  
  api-test:
    runs-on: ubuntu-latest       
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 22
          
      - name: Create .env
        working-directory: APITesting
        run:
          echo "BASEURL=${{ vars.APIURL }}" > .env
          
      - name: Create secrets.local.properties
        working-directory: APITesting
        run:
          echo "PASSWORD=${{ secrets.PASSWORD}}" > secrets.local.properties
          
      - name: Run Maven Test
        working-directory: APITesting
        run:
          mvn clean test
          
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure-results: APITesting/target/test-results
          allure-reports: allure-report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: APITesting/target/test-results
          
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report    
          