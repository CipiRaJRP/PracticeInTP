name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22  
      - name: Create .env
        run: 
          echo "BASEURL=${{ vars.BASEURL }}" > .env

      - name: Create secrets.local.env
        run: |
          echo "CARD_NUMBER=${{ secrets.CARD_NUMBER }}" > secrets.local.env
          echo "EXPIRY=${{ secrets.EXPIRY }}" >> secrets.local.env
          echo "CVV=${{ secrets.CVV }}" >> secrets.local.env
      - name: Install Dependencies
        run: npm ci
        
      - name: Install Browsers
        run: npx playwright install --with-deps

      - name: Run playwright Test 
        run: npx playwright test
        
      - name: Upload Reports
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: ../playwright-report
          
      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: ../test-results   